name: Bug report
description: Something is not working in SmartMixer
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in the sections
        below with as much detail as possible.
  - type: input
    id: version
    attributes:
      label: SmartMixer version
      description: Where did you get SmartMixer? Which version is shown in the app?
      placeholder: "1.0.0 (MSI) / built from source at commit abc1234"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2 (26100)"
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Hardware setup
      description: Which board, outputs and sensors are wired?
      placeholder: "Arduino Pro Micro (ATmega32U4, 16 MHz), 7 pots, 7 LEDs, touch sensor"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Connect the Arduino...
        2. Open the Channels page...
        3. Turn potentiometer P3...
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics output
      description: |
        Use **Copy diagnostics** on the Diagnostics page of the app and paste
        the report here. It excludes personal file paths.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched the existing issues before opening this report.
          required: true
        - label: I am running the latest release or the current `main` branch.
          required: true
